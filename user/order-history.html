<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — AURA</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="icon" type="image/png" href="../assets/favicon.png">

  <link rel="stylesheet" href="../user/css/style.css">
  <link rel="stylesheet" href="css/theme.css">
  <script>
    try { if (localStorage.getItem('aura_auth_hint') === '1') document.documentElement.classList.add('is-user'); } catch (e) { }
    document.documentElement.classList.add('js', 'ready', 'reveal-all');
  </script>

  <style>
    /* ===== ACCOUNT MENU CSS ===== */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .acct {
      position: relative;
      align-items: center;
    }

    .is-user .acct {
      display: flex !important;
    }

    .acct .avatar {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid #ead8dd;
      border-radius: 50%;
      background: #fff9f0;
      color: #8b1e3f;
      font-size: 17px;
      cursor: pointer;
    }

    .acct .menu {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      width: 230px;
      padding: 12px;
      border: 1px solid #eee0e3;
      border-radius: 12px;
      background: #fffaf5;
      box-shadow: 0 12px 35px rgba(43, 27, 33, .16);
      z-index: 500;
      display: none;
    }

    .acct.open .menu {
      display: block;
    }

    .acct .who {
      display: grid;
      gap: 5px;
      padding: 10px 9px 14px;
      margin-bottom: 5px;
      border-bottom: 1px solid #eee0e3;
      overflow-wrap: anywhere;
    }

    .acct .who b {
      color: #2b1b21;
      font-size: 14px;
    }

    .acct .who small {
      color: #827078;
      font-size: 12px;
    }

    .acct .menu a,
    .acct .menu>button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #35232b;
      font: inherit;
      font-size: 14px;
      text-decoration: none;
      text-align: left;
      cursor: pointer;
    }

    .acct .menu a:hover,
    .acct .menu>button:hover {
      background: #f8e9ee;
      color: #8b1e3f;
    }

    .acct .menu a.cur {
      background: #f8e9ee;
      color: #8b1e3f;
    }

    .acct .menu>button {
      margin-top: 5px;
      border: 1px solid #ead8dd;
      justify-content: center;
    }

    @media (max-width: 700px) {
      .nav-actions {
        gap: 7px;
      }

      .acct .avatar {
        width: 38px;
        height: 38px;
      }

      .acct .menu {
        position: fixed;
        top: 76px;
        right: 12px;
        width: min(270px, calc(100vw - 24px));
      }
    }

    /* ===== PAGE CSS ===== */
    .oh-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      font-family: 'Jost', sans-serif;
    }

    .oh-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 28px;
      align-items: flex-start;
    }

    .oh-side {
      background: #fff;
      border: 1px solid #ead9df;
      border-radius: 16px;
      padding: 16px 0 10px;
      box-shadow: 0 8px 22px -14px rgba(43, 27, 33, .12);
      overflow: hidden;
    }

    .oh-usercard {
      margin: 0 16px 18px;
      padding: 16px;
      border: 1px solid #f0e6ea;
      border-radius: 12px;
    }

    .oh-user {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #f0e6ea;
      margin-bottom: 14px;
    }

    .oh-user-info h3 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 6px;
      color: #2b1a20;
    }

    .oh-user-info small {
      font-size: 12px;
      color: #4a3a40;
      display: block;
      overflow-wrap: anywhere;
    }

    .oh-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a3194a, #6e0e33);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 17px;
      font-weight: 600;
      flex: none;
    }

    .oh-count {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid #f0e6ea;
      border-radius: 8px;
      background: #fff;
      text-align: center;
    }

    .oh-count b {
      display: block;
      font-size: 16px;
      font-weight: 600;
      color: #2b1a20;
      line-height: 1.2;
    }

    .oh-count small {
      font-size: 12px;
      color: #4a3a40;
      display: block;
    }

    .oh-side-title {
      font-size: 16px;
      font-weight: 600;
      color: #2b1a20;
      margin: 0 0 10px 24px;
    }

    .oh-nav {
      display: grid;
      border-top: 1px solid #f0e6ea;
    }

    .oh-nav a {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px 14px 24px;
      border-bottom: 1px solid #f0e6ea;
      color: #2b1a20;
      text-decoration: none;
      transition: background .2s;
    }

    .oh-nav a:hover {
      background: #fbf5f7;
    }

    .oh-nav a.active {
      background: #f8e9ee;
    }

    .oh-nav a>i.ic {
      width: 20px;
      text-align: center;
      font-size: 17px;
      color: #2b1a20;
    }

    .oh-nav a.active>i.ic {
      color: #a3194a;
    }

    .oh-nav .t {
      flex: 1;
    }

    .oh-nav .t b {
      display: block;
      font-size: 15px;
      font-weight: 500;
    }

    .oh-nav .t small {
      display: block;
      font-size: 12px;
      color: #6b5a60;
      margin-top: 2px;
    }

    .oh-nav a>i.ch {
      font-size: 12px;
      color: #2b1a20;
    }

    .oh-logout {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 20px 24px 14px;
      margin-top: 18px;
      border: 0;
      background: transparent;
      color: #c0334f;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
      text-align: left;
    }

    .oh-logout:hover {
      background: #fdeef4;
    }

    .oh-logout i {
      width: 20px;
      text-align: center;
      font-size: 18px;
    }

    .oh-main {
      display: grid;
      gap: 22px;
    }

    .oh-card {
      background: #fff;
      border: 1px solid #ead9df;
      border-radius: 16px;
      padding: 26px 28px;
      box-shadow: 0 8px 22px -14px rgba(43, 27, 33, .12);
      min-height: 300px;
    }

    .oh-card h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 18px;
      color: #2b1a20;
    }

    .oh-sub {
      font-size: 16px;
      font-weight: 500;
      margin: 0 0 12px;
      color: #2b1a20;
    }

    .oh-sub.mt {
      margin-top: 26px;
    }

    .oh-more {
      display: inline-block;
      margin-top: 12px;
      font-size: 13px;
      color: #a3194a;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .oh-empty,
    .oh-addr {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 20px;
      align-items: center;
      padding: 22px 20px;
      background: #fbf5f7;
      border: 1px solid #f0e6ea;
      border-radius: 14px;
    }

    .oh-empty-img,
    .oh-addr-img {
      width: 100px;
      height: 100px;
      display: grid;
      place-items: center;
      background: #fff;
      border-radius: 10px;
      color: #b7a3ab;
      font-size: 42px;
    }

    .oh-empty-body h3,
    .oh-addr-body h3 {
      font-size: 16px;
      font-weight: 500;
      margin: 0 0 6px;
      color: #2b1a20;
    }

    .oh-empty-body p,
    .oh-addr-body p {
      font-size: 13px;
      color: #7a6a70;
      margin: 0;
      line-height: 1.6;
    }

    .oh-empty-body a,
    .oh-addr-body a {
      color: #a3194a;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .oh-addr-list,
    .oh-list {
      display: grid;
      gap: 12px;
    }

    .oh-order {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      padding: 16px;
      background: #fff;
      border: 1px solid #f0e6ea;
      border-radius: 12px;
      color: inherit;
      cursor: pointer;
      transition: box-shadow .2s, transform .2s;
    }

    .oh-order:hover {
      box-shadow: 0 12px 30px -18px rgba(163, 25, 74, .35);
      transform: translateY(-2px);
    }

    .oh-order.oh-ret {
      cursor: default;
    }

    .oh-order.oh-ret:hover {
      box-shadow: none;
      transform: none;
    }

    .oh-order-info b {
      display: block;
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #2b1a20;
    }

    .oh-order-info small {
      display: block;
      font-size: 13px;
      color: #7a6a70;
      margin-bottom: 8px;
    }

    .oh-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: #fdeef4;
      color: #a3194a;
    }

    .oh-badge.delivered {
      background: #e7f6ec;
      color: #287443;
    }

    .oh-badge.shipped {
      background: #e6f1fb;
      color: #1e63a8;
    }

    .oh-badge.cancelled {
      background: #fdeef4;
      color: #c0334f;
    }

    .oh-badge.return_requested {
      background: #fff3cd;
      color: #856404;
    }

    .oh-order-price {
      text-align: right;
      color: #a3194a;
      font-weight: 600;
      font-size: 16px;
    }

    .oh-order-price small {
      display: block;
      font-size: 11px;
      color: #7a6a70;
      font-weight: 400;
      margin-bottom: 4px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .oh-view {
      display: inline-block;
      margin-top: 10px;
      font-size: 12px;
      color: #a3194a;
      font-weight: 500;
    }

    .btn-return {
      display: inline-block;
      margin: 6px 0 0;
      padding: 5px 12px;
      background: #fdeef4;
      color: #a3194a;
      border: 1px solid #a3194a;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    .btn-return:hover {
      background: #a3194a;
      color: #fff;
    }

    .return-closed {
      display: inline-block;
      margin: 6px 10px 0 0;
      font-size: 12px;
      color: #c0334f;
    }

    .ret-chip {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: #fff3cd;
      color: #856404;
    }

    .ret-chip.approved {
      background: #e7f6ec;
      color: #287443;
    }

    .ret-chip.rejected {
      background: #fdeef4;
      color: #c0334f;
    }

    .oh-items {
      display: grid;
      gap: 8px;
      margin: 8px 0 10px;
    }

    .oh-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .oh-item img {
      width: 44px;
      height: 56px;
      object-fit: cover;
      border-radius: 6px;
      background: #f3e6ea;
      flex: none;
    }

    .oh-item-name {
      font-size: 14px;
      font-weight: 500;
      color: #2b1a20;
      line-height: 1.3;
    }

    .oh-item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .oh-item-tags span {
      padding: 2px 9px;
      border-radius: 999px;
      background: #f3e6ea;
      color: #6e0e33;
      font-size: 11px;
      font-weight: 600;
    }

    .oh-pay {
      display: block;
      font-size: 12px;
      color: #7a6a70;
      margin-bottom: 8px;
    }

    /* ===== ORDER DETAILS POPUP ===== */
    .od-ov {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(20, 8, 14, .6);
    }

    .od-ov.show {
      display: flex;
    }

    .od-box {
      position: relative;
      width: min(680px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      padding: 26px;
      border-radius: 14px;
      background: #fff;
    }

    .od-x {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #ead9df;
      background: #fff;
      font-size: 20px;
      cursor: pointer;
      color: #2b1a20;
    }

    .od-box h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      margin: 0 0 4px;
      color: #2b1a20;
    }

    .od-sub {
      font-size: 13px;
      color: #7a6a70;
      margin: 0 0 14px;
    }

    .od-box h4 {
      margin: 18px 0 8px;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #7a6a70;
    }

    .od-item {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f0e6ea;
      color: inherit;
      text-decoration: none;
    }

    a.od-item:hover b {
      color: #a3194a;
    }

    .od-item img {
      width: 64px;
      height: 82px;
      object-fit: cover;
      border-radius: 8px;
      background: #f3e6ea;
    }

    .od-item b {
      display: block;
      font-weight: 500;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .od-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .od-card {
      padding: 12px 14px;
      border: 1px solid #f0e6ea;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      color: #2b1a20;
    }

    .od-rows div {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 14px;
    }

    .od-rows .t {
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px dashed #ead9df;
      font-weight: 600;
      font-size: 15px;
      color: #a3194a;
    }

    @media (max-width: 900px) {
      .oh-layout {
        grid-template-columns: 1fr;
      }

      .oh-order {
        grid-template-columns: 1fr;
      }

      .oh-order-price {
        text-align: left;
        margin-top: 4px;
      }

      .oh-empty,
      .oh-addr {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .oh-empty-img,
      .oh-addr-img {
        margin: 0 auto;
      }
    }

    @media (max-width: 600px) {
      .od-grid {
        grid-template-columns: 1fr;
      }
    }

    /* back to top */
    .back-to-top {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 999;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(135deg, var(--rose), var(--rose-dark));
      box-shadow: 0 8px 24px rgba(163, 25, 74, .25);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(15px) scale(.9);
      transition: opacity .3s, visibility .3s, transform .3s, box-shadow .3s, background .3s
    }

    .back-to-top.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: none
    }

    .back-to-top:hover {
      background: linear-gradient(135deg, #ff8fbd, #f43f8c);
      transform: translateY(-5px) scale(1.06);
      box-shadow: 0 12px 28px rgba(244, 63, 140, .4), 0 0 0 5px rgba(255, 143, 189, .15)
    }

    .back-to-top:hover svg {
      animation: arrowUp .45s
    }

    @keyframes arrowUp {
      50% {
        transform: translateY(-4px)
      }
    }
  </style>
</head>

<body>

  <!-- icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-heart" viewBox="0 0 24 24">
        <path
          d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </symbol>
      <symbol id="i-chev" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6" />
      </symbol>
    </defs>
  </svg>

  <script src="js/navbar.js" data-active="account"></script>

  <!-- ===== PAGE CONTENT ===== -->
  <main class="oh-page">
    <div class="oh-layout">
      <aside class="oh-side">
        <div class="oh-usercard">
          <div class="oh-user">
            <div class="oh-user-info">
              <h3 id="ohName">Hey, User</h3><small id="ohPhone">—</small>
            </div>
            <div class="oh-avatar" id="ohAvatar">U</div>
          </div>
          <div class="oh-count"><b id="ohTotalOrders">0</b><small>Total Orders</small></div>
        </div>
        <h4 class="oh-side-title">Account</h4>
        <nav class="oh-nav" id="ohNav">
          <a href="#overview" data-view="overview"><i class="ic fa-solid fa-house"></i><span
              class="t"><b>Overview</b><small>All details at one place, easy to access</small></span><i
              class="ch fa-solid fa-chevron-right"></i></a>
          <a href="#orders" data-view="orders"><i class="ic fa-solid fa-bag-shopping"></i><span class="t"><b>My
                Orders</b><small>Track your recent purchases</small></span><i
              class="ch fa-solid fa-chevron-right"></i></a>
          <a href="#address" data-view="address"><i class="ic fa-solid fa-location-dot"></i><span class="t"><b>My
                Address</b><small>Manage shipping addresses</small></span><i
              class="ch fa-solid fa-chevron-right"></i></a>
          <a href="#returns" data-view="returns"><i class="ic fa-solid fa-rotate-left"></i><span class="t"><b>My
                Returns</b><small>Track your recent returns</small></span><i
              class="ch fa-solid fa-chevron-right"></i></a>
        </nav>
        <button type="button" class="oh-logout" id="ohLogout"><i class="fa-solid fa-arrow-right-from-bracket"></i>
          Logout</button>
      </aside>

      <div class="oh-main">
        <section class="oh-card">
          <h2 id="ohTitle">Overview</h2>
          <div id="ohContent"></div>
        </section>
      </div>
    </div>
  </main>

  <!-- Return Modal -->
  <div id="returnModal"
    style="display: none; position: fixed; inset: 0; z-index: 1100; background: rgba(0,0,0,0.6); align-items: center; justify-content: center;">
    <div style="background: #fff; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px;">
      <h3 style="font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; margin-bottom: 8px;">Return Item</h3>
      <p id="returnItemInfo" style="font-size: 14px; font-weight: 500; color: #2b1a20; margin-bottom: 4px;"></p>
      <div id="returnQtyWrap" style="display:none; margin: 8px 0 4px;">
        <label for="returnQty" style="font-size: 13px; color: #7a6a70;">Quantity to return</label>
        <select id="returnQty"
          style="margin-left: 8px; padding: 6px 10px; border: 1px solid #ead9df; border-radius: 6px; font-family: inherit;"></select>
      </div>
      <p style="font-size: 13px; color: #7a6a70; margin: 10px 0 15px;">Please provide a reason for returning the item.
      </p>
      <textarea id="returnReason" placeholder="Reason for return..."
        style="width: 100%; height: 80px; padding: 10px; border: 1px solid #ead9df; border-radius: 8px; margin-bottom: 15px; font-family: inherit;"></textarea>
      <div style="display: flex; gap: 10px;">
        <button id="cancelReturnBtn"
          style="flex: 1; padding: 10px; border: 1px solid #ead9df; border-radius: 6px; background: #fff; color: #35232b; cursor: pointer;">Cancel</button>
        <button id="submitReturnBtn"
          style="flex: 1; padding: 10px; border: 1px solid #a3194a; border-radius: 6px; background: #a3194a; color: #fff; cursor: pointer;">Submit
          Request</button>
      </div>
    </div>
  </div>

  <!-- Order Details Modal -->
  <div id="orderModal" class="od-ov">
    <div class="od-box">
      <button type="button" class="od-x" id="odClose" aria-label="Close">&times;</button>
      <div id="odBody"></div>
    </div>
  </div>

  <!-- Back To Top -->
  <button id="backToTop" class="back-to-top" type="button" aria-label="Back to top" title="Back to top">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19V5"></path>
      <path d="M5 12l7-7 7 7"></path>
    </svg>
  </button>

  <script src="js/theme.js"></script>

  <!-- NAV DROPDOWN + MOBILE MENU + WISHLIST BADGE -->
  <script>
    (function () {
      try {
        var w = JSON.parse(localStorage.getItem('aura_wishlist')) || [];
        var b = document.getElementById('wishBadge'); if (b) b.textContent = w.length;
        var c = (JSON.parse(localStorage.getItem('aura_cart')) || []).reduce(function (s, x) { return s + (x.qty || 1); }, 0);
        var cb = document.getElementById('cartBadge'); if (cb) cb.textContent = c;
      } catch (e) { }
    })();

    document.addEventListener("DOMContentLoaded", function () {
      var burger = document.getElementById("burger"); var mclose = document.getElementById("mclose");
      if (burger) burger.addEventListener("click", function () { document.body.classList.add("mmenu-open"); });
      if (mclose) mclose.addEventListener("click", function () { document.body.classList.remove("mmenu-open"); });
    });
  </script>

  <!-- ============ PAGE LOGIC ============ -->
  <script type="module">
    import {
      auth, db, onAuthStateChanged, signOut, isCustomerUser,
      collection, getDocs, query, where, addDoc, doc, updateDoc, serverTimestamp
    } from "./js/firebase.js";

    const ohAvatar = document.getElementById("ohAvatar");
    const ohName = document.getElementById("ohName");
    const ohPhone = document.getElementById("ohPhone");
    const ohTotal = document.getElementById("ohTotalOrders");
    const ohLogout = document.getElementById("ohLogout");
    const ohTitle = document.getElementById("ohTitle");
    const ohContent = document.getElementById("ohContent");
    const navLinks = document.querySelectorAll("#ohNav a");

    let ORDERS = [];
    let RETURNS = [];
    let ADDRESSES = [];
    let currentReturn = null;   // { order, item }

    function inr(n) { return "₹" + Number(n || 0).toLocaleString("en-IN"); }
    function fmtDate(ts) {
      if (!ts) return "—";
      const d = typeof ts.toDate === "function" ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
    }
    function esc(v) {
      return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function statusClass(s) {
      s = String(s || "pending").toLowerCase();
      if (s === "delivered") return "delivered";
      if (s === "cancelled") return "cancelled";
      if (s === "shipped" || s === "dispatched") return "shipped";
      if (s === "return_requested") return "return_requested";
      return "";
    }
    const payText = o => o.paymentStatus === "verification" ? "verifying" : (o.paymentStatus || "pending");

    function emptyBox(icon, title, html) {
      return `<div class="oh-empty"><div class="oh-empty-img"><i class="fa-solid ${icon}"></i></div><div class="oh-empty-body"><h3>${title}</h3><p>${html}</p></div></div>`;
    }

    /* ---------- return helpers ---------- */
    /* 7-day return window (starts when admin marks the order delivered) */
    function inReturnWindow(o) {
      const dd = o.deliveredAt || o.updatedAt || o.createdAt;
      if (!dd) return true;
      const t = typeof dd.toDate === "function" ? dd.toDate().getTime() : new Date(dd).getTime();
      const days = (Date.now() - t) / (1000 * 3600 * 24);
      return days <= 7 && days >= 0;
    }
    /* has a return already been requested for this exact item of this order? */
    function returnFor(o, i) {
      return RETURNS.find(r =>
        r.orderId === o.orderId &&
        (r.productId || "") === (i.id || "") &&
        (r.size || "") === (i.size || "") &&
        (r.color || "") === (i.color || ""));
    }

    /* ---------- order details popup ---------- */
    function detailsHTML(o) {
      const a = o.address || {};
      const st = String(o.status || "pending").replace(/_/g, " ");
      const items = (o.items || []).map(i => {
        const inner = `
          <img src="${esc(i.image || "../images/partywear.webp")}" alt="" onerror="this.style.visibility='hidden'">
          <div>
            <b>${esc(i.name || "Product")}</b>
            <div class="oh-item-tags">
              ${i.size ? `<span>Size: ${esc(i.size)}</span>` : ""}
              ${i.color ? `<span>Color: ${esc(i.color)}</span>` : ""}
              <span>Qty: ${Number(i.qty) || 1}</span>
            </div>
          </div>
          <div>${inr((Number(i.price) || 0) * (Number(i.qty) || 1))}</div>`;
        // product name/image opens the product page
        return i.id
          ? `<a class="od-item" href="product.html?id=${encodeURIComponent(i.id)}">${inner}</a>`
          : `<div class="od-item">${inner}</div>`;
      }).join("") || "<p>No items saved with this order.</p>";
      const row = (l, v) => v ? `<div><span>${l}</span><span>${v}</span></div>` : "";
      const phone = o.phone || a.phone || "";
      return `
        <h3>Order ${esc(o.orderId || o.id)}</h3>
        <p class="od-sub">${fmtDate(o.createdAt)} · <span class="oh-badge ${statusClass(o.status)}">${esc(st)}</span></p>
        <h4>Products ordered</h4>${items}
        <div class="od-grid">
          <div><h4>Delivery address</h4>
            <div class="od-card">
              <b>${esc(a.name || o.customerName || "")}</b><br>
              ${esc([a.flat, a.area].filter(Boolean).join(", "))}<br>
              ${a.landmark ? "Landmark: " + esc(a.landmark) + "<br>" : ""}
              ${esc([a.city, a.state].filter(Boolean).join(", "))}${a.pin ? " - " + esc(a.pin) : ""}<br>
              ${phone ? esc(phone) : ""}
            </div>
          </div>
          <div><h4>Payment</h4>
            <div class="od-card od-rows">
              ${row("Method", esc(String(o.paymentMethod || "").toUpperCase()))}
              ${row("Status", esc(String(payText(o)).toUpperCase()))}
              ${row("Ref / UTR", esc(o.paymentId))}
              ${row("Subtotal", inr(o.subtotal))}
              ${row("Shipping", Number(o.shipping) ? inr(o.shipping) : "Free")}
              ${Number(o.discount) ? row("Coupon", "− " + inr(o.discount)) : ""}
              ${Number(o.prepaidDiscount) ? row("Prepaid discount", "− " + inr(o.prepaidDiscount)) : ""}
              ${Number(o.codFee) ? row("COD fee", inr(o.codFee)) : ""}
              <div class="t"><span>Total</span><span>${inr(o.total)}</span></div>
            </div>
          </div>
        </div>`;
    }

    /* ---------- orders list ---------- */
    function ordersHTML(limit) {
      if (!ORDERS.length) return emptyBox("fa-box-open", "No Past Orders Yet", `Start your first order to see it here. <a href="shop.html">Shop Now</a>`);
      const list = limit ? ORDERS.slice(0, limit) : ORDERS;

      let html = `<div class="oh-list">${list.map(o => {
        const st = String(o.status || "pending").toLowerCase();
        const eligible = st === "delivered" || st === "return_requested";
        const within = eligible && inReturnWindow(o);

        const itemsHTML = (o.items || []).map((i, idx) => {
          /* each product gets its own Return button (or its return status) */
          let act = "";
          const ex = eligible ? returnFor(o, i) : null;
          if (ex) act = `<span class="ret-chip ${esc(ex.status || "pending")}">Return ${esc(ex.status || "pending")}</span>`;
          else if (within) act = `<button type="button" class="btn-return" data-oid="${esc(o.id)}" data-idx="${idx}">Return</button>`;

          return `
          <div class="oh-item">
            <img src="${esc(i.image || "../images/partywear.webp")}" alt="" onerror="this.style.visibility='hidden'">
            <div>
              <div class="oh-item-name">${esc(i.name || "Product")}</div>
              <div class="oh-item-tags">
                ${i.size ? `<span>Size: ${esc(i.size)}</span>` : ""}
                ${i.color ? `<span>Color: ${esc(i.color)}</span>` : ""}
                <span>Qty: ${Number(i.qty) || 1}</span>
                <span>${inr((Number(i.price) || 0) * (Number(i.qty) || 1))}</span>
              </div>
              ${act ? `<div>${act}</div>` : ""}
            </div>
          </div>`;
        }).join("");

        const closed = eligible && !within ? `<span class="return-closed">Return window closed (7 Days Over)</span>` : "";

        return `
          <div class="oh-order" data-oid="${esc(o.id)}">
            <div class="oh-order-info">
              <b>Order ${esc(o.orderId || o.id || "—")}</b>
              <small>${fmtDate(o.createdAt)} &nbsp;·&nbsp; ${(o.items || []).length} item(s)</small>
              <div class="oh-items">${itemsHTML}</div>
              <span class="oh-pay">${esc(String(o.paymentMethod || "").toUpperCase())} · ${esc(payText(o))}</span>
              <span class="oh-badge ${statusClass(st)}">${esc(st.replace(/_/g, " "))}</span>
              <div>${closed}<span class="oh-view">View details ›</span></div>
            </div>
            <div class="oh-order-price"><small>Total</small>${inr(o.total)}</div>
          </div>`;
      }).join("")}</div>`;
      if (limit && ORDERS.length > limit) html += `<a class="oh-more" href="#orders">View all orders</a>`;
      return html;
    }

    function addressHTML(all) {
      if (!ADDRESSES.length) return `<div class="oh-addr"><div class="oh-addr-img"><i class="fa-solid fa-location-dot"></i></div><div class="oh-addr-body"><h3>No Address Saved Yet</h3><p>Tap to add and shop faster <a href="cart.html">Add New Address Now</a></p></div></div>`;
      const list = all ? ADDRESSES : ADDRESSES.slice(0, 1);
      let html = `<div class="oh-addr-list">${list.map(a => `<div class="oh-addr"><div class="oh-addr-img"><i class="fa-solid fa-location-dot"></i></div><div class="oh-addr-body"><h3>${esc(a.name || "Saved Address")}</h3><p>${esc(a.flat || "")}${a.flat ? ", " : ""}${esc(a.area || "")}<br>${esc(a.city || "")}, ${esc(a.state || "")} — ${esc(a.pin || "")}<br>${esc(a.phone || "")}</p></div></div>`).join("")}</div>`;
      if (!all && ADDRESSES.length > 1) html += `<a class="oh-more" href="#address">View all addresses</a>`;
      return html;
    }

    /* ---------- My Returns tab ---------- */
    function returnsHTML() {
      if (!RETURNS.length) return emptyBox("fa-rotate-left", "No Returns Yet", `You haven't requested any returns. <a href="shop.html">Continue Shopping</a>`);
      return `<div class="oh-list">${RETURNS.map(r => {
        const stt = r.status || "pending";
        return `
          <div class="oh-order oh-ret">
            <div class="oh-order-info">
              <b>${esc(r.productName || "Product")}</b>
              <small>Order ${esc(r.orderId || "—")} &nbsp;·&nbsp; Requested ${fmtDate(r.createdAt)}</small>
              <div class="oh-item-tags" style="margin-bottom:8px">
                ${r.size ? `<span>Size: ${esc(r.size)}</span>` : ""}
                ${r.color ? `<span>Color: ${esc(r.color)}</span>` : ""}
                <span>Qty: ${Number(r.qty) || 1}</span>
              </div>
              <span class="oh-pay">Reason: ${esc(r.reason)}</span>
              <span class="ret-chip ${esc(stt)}" style="margin-top:0">${esc(stt)}</span>
            </div>
          </div>`;
      }).join("")}</div>`;
    }

    function render() {
      let view = (location.hash || "#overview").slice(1);
      if (!["overview", "orders", "address", "returns"].includes(view)) view = "overview";
      navLinks.forEach(a => a.classList.toggle("active", a.dataset.view === view));

      if (view === "overview") {
        ohTitle.textContent = "Overview";
        ohContent.innerHTML = `<h3 class="oh-sub">My Orders</h3>${ordersHTML(3)}<h3 class="oh-sub mt">Saved Addresses</h3>${addressHTML(false)}`;
      } else if (view === "orders") {
        ohTitle.textContent = "My Orders";
        ohContent.innerHTML = ordersHTML(0);
      } else if (view === "address") {
        ohTitle.textContent = "My Address";
        ohContent.innerHTML = addressHTML(true);
      } else {
        ohTitle.textContent = "My Returns";
        ohContent.innerHTML = returnsHTML();
      }
    }

    /* ---------- clicks (one handler for every tab) ---------- */
    ohContent.addEventListener("click", e => {
      const ret = e.target.closest(".btn-return");
      if (ret) {
        e.preventDefault(); e.stopPropagation();
        const o = ORDERS.find(x => x.id === ret.dataset.oid);
        const item = o && (o.items || [])[Number(ret.dataset.idx)];
        if (!o || !item) return;
        currentReturn = { order: o, item };

        const spec = [item.size && "Size " + item.size, item.color].filter(Boolean).join(" · ");
        document.getElementById("returnItemInfo").textContent = item.name + (spec ? " (" + spec + ")" : "");

        const q = Number(item.qty) || 1;
        const qSel = document.getElementById("returnQty");
        qSel.innerHTML = Array.from({ length: q }, (_, k) => `<option value="${k + 1}" ${k + 1 === q ? "selected" : ""}>${k + 1}</option>`).join("");
        document.getElementById("returnQtyWrap").style.display = q > 1 ? "block" : "none";

        document.getElementById("returnModal").style.display = "flex";
        return;
      }
      const card = e.target.closest(".oh-order");
      if (!card || !card.dataset.oid) return;
      const o = ORDERS.find(x => x.id === card.dataset.oid);
      if (!o) return;
      document.getElementById("odBody").innerHTML = detailsHTML(o);
      document.getElementById("orderModal").classList.add("show");
    });

    const closeOd = () => document.getElementById("orderModal").classList.remove("show");
    document.getElementById("odClose").addEventListener("click", closeOd);
    document.getElementById("orderModal").addEventListener("click", e => { if (e.target.id === "orderModal") closeOd(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeOd(); });

    window.addEventListener("hashchange", () => { render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
    render();

    async function loadOrders(user) {
      try {
        const snap = await getDocs(query(collection(db, "orders"), where("uid", "==", user.uid)));
        ORDERS = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
      } catch (e) {
        console.warn("Orders query failed:", e.code || e);
        ORDERS = [];
      }
      ohTotal.textContent = ORDERS.length;
    }

    async function loadReturns(user) {
      try {
        const snap = await getDocs(query(collection(db, "returns"), where("uid", "==", user.uid)));
        RETURNS = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
      } catch (e) {
        console.warn("Returns query failed (check Firestore rules for 'returns'):", e.code || e);
        RETURNS = [];
      }
    }

    function loadAddress(user) {
      try {
        const all = JSON.parse(localStorage.getItem("aura_addr_" + user.uid) || "{}");
        const keys = Object.keys(all).filter(k => k !== "last" && all[k] && typeof all[k] === "object");
        keys.sort((a, b) => (a === all.last ? -1 : b === all.last ? 1 : 0));
        ADDRESSES = keys.map(k => all[k]);
      } catch (e) {
        ADDRESSES = [];
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!isCustomerUser(user)) {
        location.replace("index.html");
        return;
      }
      const name = user.displayName || "User";
      ohAvatar.textContent = name.charAt(0).toUpperCase();
      ohName.textContent = "Hey, " + name;
      ohPhone.textContent = "Logged with " + user.phoneNumber;
      loadAddress(user);
      await Promise.all([loadOrders(user), loadReturns(user)]);
      render();
    });

    ohLogout.addEventListener("click", async () => {
      ohLogout.disabled = true;
      try { await signOut(auth); location.replace("index.html"); }
      catch (e) { console.error("Logout failed:", e); ohLogout.disabled = false; }
    });

    // Mobile Dropdown Toggle Logic
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".m-dropdown-toggle").forEach(function (toggle) {
        toggle.addEventListener("click", function (e) {
          e.preventDefault(); e.stopPropagation();
          this.parentElement.classList.toggle("open");
        });
      });
    });

    // Return modal
    document.getElementById("cancelReturnBtn").addEventListener("click", function () {
      document.getElementById("returnModal").style.display = "none";
      currentReturn = null;
    });

    document.getElementById("submitReturnBtn").addEventListener("click", async function () {
      const reason = document.getElementById("returnReason").value.trim();
      if (!reason) { alert("Please enter a reason for return."); return; }
      if (!currentReturn) return;

      const { order, item } = currentReturn;
      const maxQty = Number(item.qty) || 1;
      const qty = Math.min(maxQty, Math.max(1, Number(document.getElementById("returnQty").value) || maxQty));

      this.disabled = true;
      this.textContent = "Submitting...";

      try {
        await addDoc(collection(db, "returns"), {
          orderId: order.orderId,
          orderDocId: order.id,
          productId: item.id || "",
          productName: item.name || "",
          size: item.size || "",
          color: item.color || "",
          qty,
          image: item.image || "",
          reason: reason,
          uid: auth.currentUser.uid,
          status: "pending",
          createdAt: serverTimestamp()
        });

        await updateDoc(doc(db, "orders", order.id), {
          status: "return_requested",
          updatedAt: serverTimestamp()
        });

        alert("Return request submitted successfully!");
        document.getElementById("returnModal").style.display = "none";
        document.getElementById("returnReason").value = "";
        currentReturn = null;

        if (auth.currentUser) {
          await Promise.all([loadOrders(auth.currentUser), loadReturns(auth.currentUser)]);
          render();
        }
      } catch (err) {
        console.error("Return failed:", err);
        alert("Failed to submit return request.");
      } finally {
        this.disabled = false;
        this.textContent = "Submit Request";
      }
    });

    // Back To Top Arrow
    document.addEventListener("DOMContentLoaded", function () {
      var btn = document.getElementById("backToTop");
      if (!btn) return;
      function toggleBtn() { btn.classList.toggle("show", window.scrollY > 300); }
      window.addEventListener("scroll", toggleBtn, { passive: true });
      toggleBtn();
      btn.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
    });
  </script>
  <script type="module" src="js/site-settings.js"></script>
  <script type="module" src="js/session.js"></script>
</body>

</html>
