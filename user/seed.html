        // ➕ Add Products Function
        seedBtn.addEventListener("click", async () => {
            seedBtn.disabled = true;
            deleteBtn.disabled = true;
            seedBtn.textContent = "Seeding...";
            logDiv.style.display = "block";
            logDiv.innerHTML = "";

            let successCount = 0;

            for (let i = 0; i < products.length; i++) {
                const p = products[i];
                try {
                    const data = {
                        ...p,
                        images: p.image ? [p.image] : [],
                        soldSizes: [],
                        createdAt: serverTimestamp()
                    };

                    await addDoc(collection(db, "products"), data);

                    successCount++;
                    logDiv.innerHTML += `<div class="success">✅ Added: ${p.name}</div>`;
                } catch (error) {
                    console.error("Error adding:", p.name, error);
                    logDiv.innerHTML += `<div class="error">❌ Failed: ${p.name} - ${error.message}</div>`;
                }
            }

            logDiv.innerHTML += `<div style="margin-top:10px; font-weight:bold; color:#fff;">🎉 Done! Added ${successCount} out of ${products.length} products.</div>`;
            seedBtn.textContent = "Seed 31 Products";
            seedBtn.disabled = false;
            deleteBtn.disabled = false;
        });

        // 🗑️ Delete All Products Function
        deleteBtn.addEventListener("click", async () => {
            if (!confirm("Are you sure you want to delete ALL products? This cannot be undone!")) return;
            
            deleteBtn.disabled = true;
            seedBtn.disabled = true;
            deleteBtn.textContent = "Deleting...";
            logDiv.style.display = "block";
            logDiv.innerHTML = "";

            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                const totalDocs = querySnapshot.size;
                
                if (totalDocs === 0) {
                    logDiv.innerHTML += `<div class="error">⚠️ No products found to delete.</div>`;
                    return;
                }

                logDiv.innerHTML += `<div style="color:#fff;">Found ${totalDocs} products. Starting deletion...</div>`;

                let deletedCount = 0;
                
                // Delete one by one
                for (const docSnap of querySnapshot.docs) {
                    try {
                        await deleteDoc(doc(db, "products", docSnap.id));
                        deletedCount++;
                        logDiv.innerHTML += `<div class="success">🗑️ Deleted: ${docSnap.data().name || docSnap.id}</div>`;
                    } catch (error) {
                        logDiv.innerHTML += `<div class="error">❌ Failed to delete ${docSnap.id}: ${error.message}</div>`;
                    }
                }

                logDiv.innerHTML += `<div style="margin-top:10px; font-weight:bold; color:#fff;">🎉 Done! Deleted ${deletedCount} out of ${totalDocs} products.</div>`;
                
            } catch (error) {
                console.error("Delete error:", error);
                logDiv.innerHTML += `<div class="error">❌ Error: ${error.message}</div>`;
            } finally {
                deleteBtn.textContent = "🗑️ Delete All Products";
                deleteBtn.disabled = false;
                seedBtn.disabled = false;
            }
        });
