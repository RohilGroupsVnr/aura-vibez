<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading — AURA</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #a34d68;
            /* Maroon/Rose Background */
            color: #fff;
            font-family: 'Jost', sans-serif;
            animation: bgFade 0.8s ease;
        }

        /* Spinner container */
        .spinner-box {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Outer spinning ring */
        .spinner-box::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #fff;
            border-right-color: rgba(255, 255, 255, 0.3);
            animation: spinRing 1.2s linear infinite;
        }

        /* Inner spinning ring (reverse) */
        .spinner-box::after {
            content: '';
            position: absolute;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            border: 2px solid transparent;
            border-bottom-color: #f5a623;
            border-left-color: rgba(255, 255, 255, 0.2);
            animation: spinRing 0.9s linear infinite reverse;
        }

        /* Text */
        .loading-text {
            margin-top: 24px;
            font-size: 13px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            animation: pulseText 1.5s ease-in-out infinite;
        }

        @keyframes spinRing {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulseText {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes bgFade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="spinner-box"></div>
    <div class="loading-text">Loading your style...</div>

    <script>
        // 🔥 Intha 2-vathu splash screen 2 seconds kazhichu user home-ku pōgum
        setTimeout(() => {
            window.location.replace("user/splash.html");
        }, 2000);
    </script>
</body>

</html>
