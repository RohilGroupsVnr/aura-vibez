<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Home Page — AURA Admin</title>
  <link rel="icon" href="../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    /* Custom Styles for Home Page Manager */
    .admin-card { margin-bottom: 24px; }
    .prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .prod-item { border: 1px solid #ead9df; border-radius: 12px; overflow: hidden; background: #fff; display: flex; flex-direction: column; transition: box-shadow 0.3s; }
    .prod-item:hover { box-shadow: 0 8px 20px -10px rgba(0,0,0,0.1); }
    .prod-img { width: 100%; aspect-ratio: 4/5; object-fit: cover; background: #f3e6ea; }
    .prod-info { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .prod-name { font-weight: 500; font-size: 15px; margin-bottom: 6px; color: #2b1b21; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .prod-price { color: #a3194a; font-weight: 600; font-size: 16px; margin-bottom: 12px; }
    .toggle-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ead9df; background: #f9f9f9; color: #555; cursor: pointer; font-family: 'Jost', sans-serif; font-weight: 500; transition: all 0.2s; margin-top: auto; }
    .toggle-btn.active { background: #e7f6ec; border-color: #287443; color: #287443; }
    .toggle-btn:disabled { opacity: 0.6; cursor: wait; }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="admin-side" id="adminSide"></aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1>Home Page Selection</h1><p>Select which products appear in the "Most Loved Styles" section</p></div>
      <div class="admin-user"><b id="adminEmail"></b></div>
    </div>

    <div class="admin-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; margin: 0;">All Active Products</h3>
        <span id="activeCount" style="background: #a3194a; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;">0 Selected</span>
      </div>
      
      <div id="loadingMsg" style="color:var(--muted); padding:20px 0;">Loading products...</div>
      
      <div class="prod-grid" id="productsGrid">
        <!-- Products will be loaded here via JS -->
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { db, collection, getDocs, query, where, doc, updateDoc } from "./js/firebase.js";
  import { adminReady } from "./js/admin-shell.js";

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inr = n => "₹" + Number(n || 0).toLocaleString("en-IN");

  let allProducts = [];

  async function loadProducts() {
    try {
      // Fetch only active products
      const q = query(collection(db, "products"), where("status", "==", "active"));
      const snap = await getDocs(q);
      allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    } catch (e) {
      console.warn("Products query failed:", e);
      $("loadingMsg").textContent = "Failed to load products.";
    }
  }

  function render() {
    $("loadingMsg").style.display = "none";
    
    if (!allProducts.length) {
      $("productsGrid").innerHTML = `<p style="color:var(--muted)">No active products found.</p>`;
      return;
    }

    let selectedCount = 0;
    
    // Sort: Home products first, then by newest
    allProducts.sort((a, b) => {
      if (a.showOnHome && !b.showOnHome) return -1;
      if (!a.showOnHome && b.showOnHome) return 1;
      return (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0);
    });

    $("productsGrid").innerHTML = allProducts.map(p => {
      const isHome = p.showOnHome === true;
      if (isHome) selectedCount++;
      
      const img = (p.images && p.images[0]) ? p.images[0] : (p.image || "../images/partywear.webp");
      
      return `
        <div class="prod-item">
          <img src="${esc(img)}" class="prod-img" alt="${esc(p.name)}" onerror="this.src='../images/partywear.webp'">
          <div class="prod-info">
            <div class="prod-name">${esc(p.name)}</div>
            <div class="prod-price">${inr(p.price)}</div>
            
            <button class="toggle-btn ${isHome ? 'active' : ''}" data-id="${p.id}" data-status="${isHome}">
              <i class="fa-solid ${isHome ? 'fa-check-circle' : 'fa-plus-circle'}"></i>
              ${isHome ? 'Showing on Home' : 'Add to Home'}
            </button>
          </div>
        </div>
      `;
    }).join("");

    $("activeCount").textContent = selectedCount + " Selected";
  }

  // Handle Toggle Button Click
  $("productsGrid").addEventListener("click", async (e) => {
    const btn = e.target.closest(".toggle-btn");
    if (!btn) return;

    const id = btn.dataset.id;
    const isCurrentlyOnHome = btn.dataset.status === "true";
    const newStatus = !isCurrentlyOnHome;

    // UI Update (Optimistic)
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

    try {
      // Update Firestore field `showOnHome`
      await updateDoc(doc(db, "products", id), {
        showOnHome: newStatus
      });

      // Update local state
      const product = allProducts.find(p => p.id === id);
      if (product) product.showOnHome = newStatus;

      // Re-render UI
      render();
    } catch (err) {
      console.error("Failed to update status:", err);
      alert("Could not update. Check Firestore rules.");
      btn.disabled = false;
      btn.dataset.status = isCurrentlyOnHome;
      btn.innerHTML = `<i class="fa-solid ${isCurrentlyOnHome ? 'fa-check-circle' : 'fa-plus-circle'}"></i> ${isCurrentlyOnHome ? 'Showing on Home' : 'Add to Home'}`;
    }
  });

  adminReady.then(loadProducts);
</script>
</body>
</html>
