<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — AURA Admin</title>
  <link rel="icon" href="../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-side" id="adminSide"></aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1>Settings</h1><p>Store preferences &amp; social links</p></div>
      <button type="button" id="resetBtn" class="btn-admin ghost">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg> Reset
      </button>
    </div>

    <form id="settingsForm" class="settings-form">

      <section class="settings-card">
        <header class="settings-card-head">
          <div class="settings-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9h18M5 9V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4M5 9v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M9 13h6"/></svg></div>
          <div><h2>Store Info</h2><p>Basic details shown across the site</p></div>
        </header>
        <div class="settings-grid">
          <label class="settings-field"><span>Store Name</span><input type="text" id="storeName" placeholder="AURA" value="AURA" required></label>
          <label class="settings-field"><span>Tagline</span><input type="text" id="storeTagline" placeholder="Premium fashion &amp; beauty" value="Premium fashion &amp; beauty"></label>
          <label class="settings-field full"><span>Store Description</span><textarea id="storeDesc" rows="2" placeholder="A short line about your brand">AURA brings together timeless elegance and modern fashion.</textarea></label>
        </div>
      </section>

      <section class="settings-card">
        <header class="settings-card-head">
          <div class="settings-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92Z"/></svg></div>
          <div><h2>Contact</h2><p>How customers can reach you</p></div>
        </header>
        <div class="settings-grid">
          <label class="settings-field"><span>Support Email</span><div class="field-icon"><i class="fa-solid fa-envelope"></i><input type="email" id="supportEmail" placeholder="support@aura.com"></div></label>
          <label class="settings-field"><span>Support Phone</span><div class="field-icon"><i class="fa-solid fa-phone"></i><input type="tel" id="supportPhone" placeholder="+91 98765 43210"></div></label>
          <label class="settings-field"><span>WhatsApp</span><div class="field-icon"><i class="fa-brands fa-whatsapp"></i><input type="tel" id="whatsappNumber" placeholder="+91 98765 43210"></div></label>
          <label class="settings-field"><span>Address</span><div class="field-icon"><i class="fa-solid fa-location-dot"></i><input type="text" id="storeAddress" placeholder="City, State"></div></label>
        </div>
      </section>

      <section class="settings-card">
        <header class="settings-card-head">
          <div class="settings-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></div>
          <div><h2>Social Links</h2><p>Your social media profiles</p></div>
        </header>
        <div class="settings-grid">
          <label class="settings-field"><span>Instagram</span><div class="field-icon brand-instagram"><i class="fa-brands fa-instagram"></i><input type="url" id="instagram" placeholder="https://instagram.com/aura"></div></label>
          <label class="settings-field"><span>Facebook</span><div class="field-icon brand-facebook"><i class="fa-brands fa-facebook-f"></i><input type="url" id="facebook" placeholder="https://facebook.com/aura"></div></label>
          <label class="settings-field"><span>YouTube</span><div class="field-icon brand-youtube"><i class="fa-brands fa-youtube"></i><input type="url" id="youtube" placeholder="https://youtube.com/@aura"></div></label>
          <label class="settings-field"><span>Pinterest</span><div class="field-icon brand-pinterest"><i class="fa-brands fa-pinterest-p"></i><input type="url" id="pinterest" placeholder="https://pinterest.com/aura"></div></label>
        </div>
      </section>

      <div class="settings-savebar">
        <p class="settings-msg" id="settingsMsg" role="status" aria-live="polite"></p>
        <button type="submit" class="btn-admin primary" id="saveBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg> <span>Save Changes</span>
        </button>
      </div>
    </form>
  </main>
</div>

<script type="module">
  import { db, doc, getDoc, setDoc, serverTimestamp } from "./js/firebase.js";
  import { adminReady } from "./js/admin-shell.js";

  const $ = id => document.getElementById(id);
  const FIELDS = ["storeName", "storeTagline", "storeDesc", "supportEmail", "supportPhone", "whatsappNumber", "storeAddress", "instagram", "facebook", "youtube", "pinterest"];

  // ✅ ALL fields are mirrored to settings/public so the user-side site (footer etc.) can read them
  const PUBLIC_FIELDS = FIELDS;

  function setMsg(text, kind) {
    $("settingsMsg").textContent = text || "";
    $("settingsMsg").style.color = kind === "error" ? "#c0334f" : kind === "ok" ? "#17805A" : "";
  }

  async function loadSettings() {
    setMsg("Loading settings…");
    try {
      const snap = await getDoc(doc(db, "settings", "store"));
      if (!snap.exists()) { setMsg("No saved settings yet — fill the form and click Save.", "ok"); return; }
      const s = snap.data();
      FIELDS.forEach(id => { if ($(id) && s[id] != null) $(id).value = s[id]; });
      setMsg("Settings loaded ✓", "ok");
    } catch (err) {
      console.error("Load settings:", err);
      setMsg(err?.code ? `Load failed: ${err.code}` : "Could not load settings.", "error");
    }
  }

  $("settingsForm").addEventListener("submit", async e => {
    e.preventDefault();
    const data = {};
    FIELDS.forEach(id => { data[id] = $(id).value.trim(); });
    data.supportEmail = data.supportEmail.toLowerCase();
    if (!data.storeName) { setMsg("Store name is required.", "error"); $("storeName").focus(); return; }

    $("saveBtn").disabled = true;
    setMsg("Saving…");
    try {
      // 1) private admin copy
      await setDoc(doc(db, "settings", "store"), { ...data, updatedAt: serverTimestamp() }, { merge: true });

      // 2) public copy -> read by the user-side website footer
      let publicOk = true, publicCode = "";
      try {
        const pub = {};
        PUBLIC_FIELDS.forEach(k => { pub[k] = data[k]; });
        await setDoc(doc(db, "settings", "public"), { ...pub, updatedAt: serverTimestamp() }, { merge: true });
      } catch (pubErr) {
        publicOk = false;
        publicCode = pubErr?.code || "error";
        console.warn("Public mirror save failed:", pubErr);
      }

      if (publicOk) setMsg("Saved ✓ — website updated", "ok");
      else setMsg(`Saved, but website NOT updated (${publicCode}). Check Firestore rules for settings/public.`, "error");
    } catch (err) {
      console.error("Save settings:", err);
      setMsg(err?.code ? `Save failed: ${err.code}` : "Save failed. Try again.", "error");
    } finally { $("saveBtn").disabled = false; }
  });

  $("resetBtn").addEventListener("click", async () => {
    if (confirm("Reload saved settings? Unsaved changes will be lost.")) await loadSettings();
  });

  adminReady.then(loadSettings);
</script>
</body>
</html>
